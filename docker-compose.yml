# 生产部署（阿里云 ECS 推荐用本文件，不要用卷覆盖 /app）
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: next-gif-to-webp
    ports:
      - "8090:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
    # 需要时在项目根目录创建 .env.production，并取消下一行注释
    # env_file:
    #   - .env.production
    restart: unless-stopped
    # 勿挂载 .:/app —— 会覆盖镜像内 .next，导致 next start 立刻退出并无限重启
