# 本地开发：挂载源码 + 容器内 dev（不会用于生产）
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: base
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "pnpm install && pnpm dev"
    restart: "no"

volumes:
  node_modules:
